<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1150" role="img" aria-labelledby="pcLogoTitle">
  <title id="pcLogoTitle">The Pink Cactus - Mexican Food &amp; Drinks - Waukegan, IL</title>
  <defs>
    <radialGradient id="duskSky" cx="50%" cy="60%" r="70%">
      <stop offset="0%" stop-color="#ffd25c"/>
      <stop offset="35%" stop-color="#ff8a3d"/>
      <stop offset="65%" stop-color="#ff3f7e"/>
      <stop offset="100%" stop-color="#7a1450"/>
    </radialGradient>
    <linearGradient id="bodyPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5fbf"/>
      <stop offset="100%" stop-color="#e8199a"/>
    </linearGradient>
    <linearGradient id="hatPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5fbf"/>
      <stop offset="100%" stop-color="#d80e82"/>
