    <path d="M300 760 C330 715 380 712 415 748 C372 748 342 765 322 800 C310 780 302 768 300 760Z"/>
    <path d="M300 760 C285 715 300 675 340 660 C325 695 328 728 312 760Z"/>
    <path d="M700 760 C660 720 610 715 575 750 C620 750 650 770 670 810 C685 785 696 772 700 760Z"/>
    <path d="M700 760 C730 715 780 712 815 748 C772 748 742 765 722 800 C710 780 702 768 700 760Z"/>
    <path d="M700 760 C685 715 700 675 740 660 C725 695 728 728 712 760Z"/>
  </g>
  <circle cx="330" cy="795" r="14" fill="#ff5fbf"/>
  <circle cx="670" cy="795" r="14" fill="#ff5fbf"/>

