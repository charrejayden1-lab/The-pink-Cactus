      <path d="M410 332 l34 6 -30 12 z"/>
      <path d="M460 338 l34 4 -30 12 z"/>
      <path d="M512 338 l34 -2 -28 12 z"/>
      <path d="M562 332 l34 -6 -28 14 z"/>
      <path d="M612 322 l32 -8 -26 16 z"/>
    </g>
