    <ellipse cx="537" cy="440" rx="10" ry="14" fill="#2a0c24"/>
    <path d="M440 418 q23 -22 40 -2" fill="none" stroke="#2a0c24" stroke-width="5" stroke-linecap="round"/>
    <path d="M520 416 q23 -20 40 2" fill="none" stroke="#2a0c24" stroke-width="5" stroke-linecap="round"/>
    <circle cx="448" cy="468" r="12" fill="#ff9ad6" opacity=".7"/>
    <circle cx="552" cy="468" r="12" fill="#ff9ad6" opacity=".7"/>
    <path d="M470 480 Q500 505 530 480" fill="none" stroke="#2a0c24" stroke-width="6" stroke-linecap="round"/>
