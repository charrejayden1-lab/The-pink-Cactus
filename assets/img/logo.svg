    <circle cx="647" cy="90" r="13"/>
    <circle cx="763" cy="185" r="13"/>
    <circle cx="825" cy="320" r="13"/>
    <circle cx="825" cy="470" r="13"/>
    <circle cx="175" cy="90" r="13"/>
    <circle cx="237" cy="185" r="13"/>
    <circle cx="175" cy="470" r="13"/>
    <circle cx="353" cy="55" r="14"/>
  </g>

  <circle cx="500" cy="430" r="368" fill="none" stroke="url(#goldText)" stroke-width="10"/>
  <circle cx="500" cy="430" r="345" fill="url(#duskSky)"/>

