  <text x="500" y="1080" font-family="Georgia, 'Times New Roman', serif" font-weight="800" font-size="150" letter-spacing="4" fill="url(#pinkText)" stroke="url(#goldText)" stroke-width="3" text-anchor="middle">CACTUS</text>

  <g fill="#17c9ab" opacity=".9">
    <path d="M420 1000 q10 -30 40 -30 q-18 20 -14 44 q-18 -4 -26 -14Z"/>
    <path d="M580 1000 q-10 -30 -40 -30 q18 20 14 44 q18 -4 26 -14Z"/>
  </g>
</svg>
