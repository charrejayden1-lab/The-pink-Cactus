    <rect x="659" y="400" width="38" height="34" fill="#fff8e6" stroke="#8a5c18" stroke-width="2"/>
    <text x="678" y="422" font-family="Georgia, serif" font-size="10" fill="#8a5c18" text-anchor="middle" font-weight="700">TEQ</text>
    <path d="M586 500 C615 470 650 460 680 478" fill="none" stroke="url(#bodyPink)" stroke-width="26" stroke-linecap="round"/>
