      <stop offset="55%" stop-color="#ff2fa1"/>
      <stop offset="100%" stop-color="#b80f6d"/>
    </linearGradient>
    <clipPath id="badgeClip"><circle cx="500" cy="430" r="345"/></clipPath>
  </defs>

