    <linearGradient id="goldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe9ad"/>
      <stop offset="45%" stop-color="#e8b84b"/>
      <stop offset="100%" stop-color="#b8842a"/>
