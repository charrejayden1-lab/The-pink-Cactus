    <path d="M414 470 C365 466 335 445 328 402 C324 384 330 366 348 358 C352 398 375 424 414 436 Z"/>
    <path d="M586 500 C635 496 665 475 672 432 C676 414 670 396 652 388 C648 428 625 454 586 466 Z"/>
