    <ellipse cx="500" cy="298" rx="115" ry="66" fill="url(#hatPink)" stroke="#b80f6d" stroke-width="5"/>
    <path d="M405 300 Q500 250 590 300" fill="none" stroke="#e8b84b" stroke-width="6"/>
    <g fill="#17c9ab" opacity=".95">
