    <line x1="360" y1="470" x2="360" y2="520" stroke="#e8b84b" stroke-width="6"/>
    <path d="M414 500 C380 470 340 460 305 480" fill="none" stroke="url(#bodyPink)" stroke-width="26" stroke-linecap="round"/>
